<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Référencement & PWA -->
    <title>Amidah - 18 Bénédictions</title>
    <meta name="description" content="Livre de prière numérique">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">

    <!-- Swiper CSS (Librairie pour le slide) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* --- RESET & BASE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0;
            /* Utilisation de dvh pour s'adapter parfaitement aux mobiles avec barres d'adresse */
            height: 100vh;
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
            background-color: #121212; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- CONTENEUR SWIPER --- */
        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            /* Important pour l'effet stack : permet de voir la carte du dessous */
            overflow: visible; 
            background: transparent;
        }

        /* --- LA CARTE (SCÈNE 3D) --- */
        .card-scene {
            width: 100%;
            /* Dimensions ajustées pour bien remplir l'écran sans déborder */
            max-width: 90vw; 
            aspect-ratio: 9/16; 
            max-height: 85dvh; /* Laisse un peu de place en haut/bas pour l'effet d'empilement */
            perspective: 1000px;
            cursor: pointer;
            margin: auto; 
            position: relative;
        }

        /* Le conteneur qui bouge */
        .card-object {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); /* Animation de retournement plus fluide */
            border-radius: 20px;
            /* Ombre portée dynamique pour l'effet de pile */
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* Classe ajoutée en JS pour retourner la carte */
        .card-object.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- FACES DE LA CARTE --- */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            background: #1a1a1a; /* Fond de sécurité sombre */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Face Arrière (Verso) */
        .card-face.back {
            transform: rotateY(180deg);
            background: #1a1a1a;
        }

        /* --- IMAGES --- */
        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* L'image entière est toujours visible */
            pointer-events: none;
            display: block;
        }
        
        /* Style pour le message d'erreur d'image */
        .error-message {
            padding: 20px;
            font-size: 0.8em;
            text-align: center;
            color: white;
            line-height: 1.4;
            background: rgba(0,0,0,0.8);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Swiper Container Principal -->
    <div class="swiper">
        <!-- Les cartes seront générées ici par le Javascript -->
        <div class="swiper-wrapper" id="cards-wrapper"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // CONFIGURATION
        const totalCards = 18; // Nombre total de cartes
        const wrapper = document.getElementById('cards-wrapper');
        let isGlobalFlipped = false; // État global : est-ce qu'on regarde le recto ou le verso ?

        // FONCTION DE GESTION D'ERREUR
        window.handleImageError = function(imgElement, imageSource) {
            imgElement.style.display = 'none';
            const msg = document.createElement('div');
            msg.className = 'error-message';
            msg.innerHTML = `Image manquante:<br><br>${imageSource}`;
            imgElement.parentElement.appendChild(msg);
        };

        // GÉNÉRATION AUTOMATIQUE DES 18 CARTES
        for (let i = 1; i <= totalCards; i++) {
            const num = i.toString().padStart(2, '0');
            const imgRecto = `images/cards/card-${num}-a.png`;
            const imgVerso = `images/cards/card-${num}-b.png`;

            const slideHTML = `
                <div class="swiper-slide">
                    <div class="card-scene" onclick="toggleGlobalFlip()">
                        <div class="card-object">
                            <!-- RECTO (Face A) -->
                            <div class="card-face front">
                                <img src="${imgRecto}" alt="Bénédiction ${i}" 
                                     onerror="handleImageError(this, '${imgRecto}')">
                            </div>

                            <!-- VERSO (Face B) -->
                            <div class="card-face back">
                                <img src="${imgVerso}" alt="Explication ${i}"
                                     onerror="handleImageError(this, '${imgVerso}')">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            wrapper.insertAdjacentHTML('beforeend', slideHTML);
        }

        // 1. Initialisation de Swiper (Mode "STACK" Vertical)
        const swiper = new Swiper('.swiper', {
            direction: 'vertical',
            effect: 'creative', // Utilisation de l'effet "Créatif" pour faire le tas
            creativeEffect: {
                limitProgress: 6, // Augmentation pour voir plus de cartes empilées en haut
                perspective: true,
                prev: {
                    // Les cartes précédentes remontent et s'empilent en haut
                    shadow: true,
                    // [x, y, z] : Remonte de 12% par carte, reste en taille réelle (scale 1)
                    translate: [0, '-12%', -1], 
                    scale: 1, 
                    opacity: 1, 
                },
                next: {
                    // La carte suivante arrive du bas et couvre tout
                    translate: [0, '100%', 0], 
                },
            },
            speed: 600, // Vitesse de l'animation (ms) - un peu plus lent pour le "poids"
            resistanceRatio: 0.8, // Sensation élastique aux extrémités
            mousewheel: true,
            keyboard: { enabled: true },
        });

        // 2. Fonction Globale pour retourner TOUTES les cartes
        function toggleGlobalFlip() {
            isGlobalFlipped = !isGlobalFlipped;
            
            const allCards = document.querySelectorAll('.card-object');
            allCards.forEach(card => {
                if (isGlobalFlipped) {
                    card.classList.add('is-flipped');
                } else {
                    card.classList.remove('is-flipped');
                }
            });
        }
    </script>
</body>
</html>

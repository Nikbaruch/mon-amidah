<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Référencement & PWA -->
    <title>Amidah - 18 Bénédictions</title>
    <meta name="description" content="Livre de prière numérique">
    
    <!-- Configuration iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <!-- Icône pour l'écran d'accueil -->
    <link rel="apple-touch-icon" href="images/cards/card-01-a.png">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* ==========================================================================
           PARAMÈTRES D'AJUSTEMENT VISUEL (Modifiez ces valeurs selon vos besoins)
           ========================================================================== */
        :root {
            /* 1. Taille de la carte au premier plan */
            --card-width: 88vw;               /* Largeur de la carte (ex: 75vw à 92vw) */
            --card-max-height: 60dvh;         /* Hauteur max de la carte (ex: 50dvh à 75dvh) */
            --card-radius: 3.1% / 2.2%;       /* Arrondi des coins de la carte */

            /* 2. Opacité de la carte au premier plan */
            --face-a-opacity: 1;              /* Opacité quand la Face A est devant (1 = 100%) */
            --face-b-opacity: 0.93;           /* Opacité quand la Face B est devant (0.93 = 93%) */

            /* 3. Lueur externe noire (effet de premier plan) */
            /* Format : [décalage-x] [décalage-y] [flou] [étendue] [couleur] */
            --card-glow: 0 0 28px 6px rgba(0, 0, 0, 0.85);

            /* 4. Arrière-plan (plein écran sans bord) & Voiles */
            /* Zoom (> 1.07) pour rogner les bords de la carte en arrière-plan */
            --bg-scale-a: 1.08;               /* Zoom du fond quand la Face A est en arrière-plan */
            --bg-scale-b: 1.08;               /* Zoom du fond quand la Face B est en arrière-plan */
            --bg-veil-black: 0.47;            /* Voile noir (47%) sur le fond quand la Face B est devant */
            --bg-veil-white: 0.47;            /* Voile blanc (47%) sur le fond quand la Face A est devant */

            /* 5. Vitesse des animations */
            --flip-duration: 0.6s;            /* Durée du retournement 3D */
            --flip-half: 0.3s;                /* Moitié de --flip-duration (bascule à 90°) */
        }

        /* ==========================================================================
           RESET & BASE
           ========================================================================== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* ==========================================================================
           SCÈNE D'ARRIÈRE-PLAN FIXE (FONDU ENCHAÎNÉ AU CHANGEMENT DE CARTE)
           ========================================================================== */
        #bg-stage {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            background-color: #000000;
        }

        .bg-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition-property: opacity;
            transition-timing-function: ease-out;
            will-change: opacity;
        }

        .bg-slide.is-unloaded {
            visibility: hidden;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity var(--flip-duration) ease;
        }

        /* Fond Face B (visible quand la Face A est au premier plan) */
        .bg-layer.bg-b {
            background-color: #ffffff;
            opacity: 1;
        }

        /* Voile blanc de 47% par-dessus l'image de fond quand la Face A est au premier plan */
        .bg-layer.bg-b::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 255, var(--bg-veil-white));
            pointer-events: none;
        }

        /* Fond Face A (visible quand la Face B est au premier plan) */
        .bg-layer.bg-a {
            background-color: #000000;
            opacity: 0;
        }

        /* Voile noir de 47% par-dessus l'image de fond quand la Face B est au premier plan */
        .bg-layer.bg-a::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, var(--bg-veil-black));
            pointer-events: none;
        }

        /* Si l'image est manquante, pas de voile blanc sur le fond noir */
        .bg-layer.is-missing::after {
            display: none;
        }

        /* Bascule de l'arrière-plan quand la carte est retournée */
        .bg-slide.is-flipped .bg-layer.bg-b {
            opacity: 0;
        }
        .bg-slide.is-flipped .bg-layer.bg-a {
            opacity: 1;
        }

        .bg-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Couvre 100% de la hauteur et de la largeur */
            object-position: center center;
            display: block;
            pointer-events: none;
        }

        .bg-layer.bg-a img {
            transform: scale(var(--bg-scale-a));
        }

        .bg-layer.bg-b img {
            transform: scale(var(--bg-scale-b));
        }

        /* ==========================================================================
           CONTENEUR SWIPER (CARTES AU PREMIER PLAN QUI S'EMPILENT)
           ========================================================================== */
        .swiper {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            touch-action: none;
            background: transparent;
        }

        .swiper-slide {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
            background: transparent;
        }

        /* Une fois le swipe terminé, on cache la pile de cartes en dessous */
        .swiper:not(.is-sliding) .swiper-slide:not(.swiper-slide-active) .card-scene {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        /* Optimisation mémoire iOS : masque le rendu des slides éloignées */
        .swiper-slide.is-unloaded .card-scene {
            visibility: hidden;
        }

        /* ==========================================================================
           CARTE AU PREMIER PLAN (SCÈNE 3D)
           ========================================================================== */
        .card-scene {
            position: relative;
            z-index: 2;
            /* Garde toujours le ratio exact 1080/1522 de la carte pour que la lueur colle aux bords */
            width: min(var(--card-width), calc(var(--card-max-height) * 1080 / 1522));
            aspect-ratio: 1080 / 1522;
            perspective: 1200px;
            cursor: pointer;
            margin: auto;
        }

        .card-object {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform var(--flip-duration) cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* État retourné (Face B au premier plan) */
        .swiper-slide.is-flipped .card-object {
            transform: rotateY(180deg);
        }

        /* --- FACES DE LA CARTE --- */
        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: var(--card-radius);
            /* Lueur externe noire pour l'effet de premier plan */
            box-shadow: var(--card-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        /* Bascule nette à mi-parcours (90°) pour que la Face A ne transparaisse jamais sous les 93% de la Face B */
        .card-face.front {
            opacity: 1;
            transition: opacity 0s linear var(--flip-half);
        }

        .card-face.back {
            transform: rotateY(180deg);
            opacity: 0;
            transition: opacity 0s linear var(--flip-half);
        }

        .swiper-slide.is-flipped .card-face.front {
            opacity: 0;
        }

        .swiper-slide.is-flipped .card-face.back {
            opacity: 1;
        }

        /* Opacité propre à chaque face au premier plan */
        .card-face.front img {
            opacity: var(--face-a-opacity);
        }

        .card-face.back img {
            opacity: var(--face-b-opacity);
        }

        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            display: block;
        }

        /* Désactive temporairement les transitions internes pour les mises à jour instantanées hors-écran */
        .no-transition .card-object,
        .no-transition .card-face,
        .no-transition .bg-layer {
            transition: none !important;
        }
    </style>
</head>
<body>

    <!-- Scène d'arrière-plan fixe (transite en fondu enchaîné) -->
    <div id="bg-stage"></div>

    <!-- Swiper Container Principal (cartes au premier plan qui arrivent par-dessus) -->
    <div class="swiper">
        <div class="swiper-wrapper" id="cards-wrapper"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const totalCards = 18;
            const bgStage = document.getElementById('bg-stage');
            const wrapper = document.getElementById('cards-wrapper');
            let isGlobalFlipped = false; // false = Face A au 1er plan / true = Face B au 1er plan

            if (!wrapper || !bgStage) return;

            // Gestion d'erreur d'image : affiche simplement un fond noir à la place
            window.handleImageError = function(imgElement) {
                if (!imgElement.getAttribute('src')) return; // Ignore la décharge mémoire volontaire
                imgElement.dataset.failed = 'true';
                imgElement.style.display = 'none';
                if (imgElement.parentElement) {
                    imgElement.parentElement.classList.add('is-missing');
                    imgElement.parentElement.style.backgroundColor = '#000000';
                }
            };

            // 1. GÉNÉRATION DES 18 ARRIÈRE-PLANS ET DES 18 CARTES DE PREMIER PLAN
            for (let i = 1; i <= totalCards; i++) {
                const num = i.toString().padStart(2, '0');
                const imgRecto = `images/cards/card-${num}-a.png`;
                const imgVerso = `images/cards/card-${num}-b.png`;

                // Arrière-plan (dans #bg-stage fixe, pour le fondu enchaîné)
                const bgHTML = `
                    <div class="bg-slide is-unloaded" data-index="${i - 1}">
                        <div class="bg-layer bg-b">
                            <img data-src="${imgVerso}" alt="" decoding="async"
                                 onerror="handleImageError(this)">
                        </div>
                        <div class="bg-layer bg-a">
                            <img data-src="${imgRecto}" alt="" decoding="async"
                                 onerror="handleImageError(this)">
                        </div>
                    </div>
                `;
                bgStage.insertAdjacentHTML('beforeend', bgHTML);

                // Carte au premier plan (dans Swiper, pour l'arrivée verticale par-dessus)
                const slideHTML = `
                    <div class="swiper-slide is-unloaded" data-index="${i - 1}">
                        <div class="card-scene">
                            <div class="card-object">
                                <!-- RECTO (Face A - 100% opacité) -->
                                <div class="card-face front">
                                    <img data-src="${imgRecto}" alt="Bénédiction ${i}" decoding="async"
                                         onerror="handleImageError(this)">
                                </div>

                                <!-- VERSO (Face B - 93% opacité) -->
                                <div class="card-face back">
                                    <img data-src="${imgVerso}" alt="Explication ${i}" decoding="async"
                                         onerror="handleImageError(this)">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                wrapper.insertAdjacentHTML('beforeend', slideHTML);
            }

            const bgSlides = bgStage.querySelectorAll('.bg-slide');
            const swiperSlides = wrapper.querySelectorAll('.swiper-slide');

            // 2. GESTION MÉMOIRE GPU iOS :
            // Ne garde en mémoire que la carte active et ses voisines immédiates (évite le crash WebKit sur iOS)
            function updateLoadedSlides(activeIndex) {
                for (let index = 0; index < totalCards; index++) {
                    const shouldBeLoaded = index >= activeIndex - 1 && index <= activeIndex + 2;
                    const pair = [swiperSlides[index], bgSlides[index]];

                    pair.forEach(container => {
                        if (!container) return;
                        const imgs = container.querySelectorAll('img[data-src]');
                        if (shouldBeLoaded) {
                            container.classList.remove('is-unloaded');
                            imgs.forEach(img => {
                                if (img.dataset.failed === 'true') return;
                                const targetSrc = img.getAttribute('data-src');
                                if (img.getAttribute('src') !== targetSrc) {
                                    img.style.display = 'block';
                                    img.setAttribute('src', targetSrc);
                                }
                            });
                        } else {
                            container.classList.add('is-unloaded');
                            imgs.forEach(img => {
                                if (img.hasAttribute('src')) {
                                    img.removeAttribute('src');
                                }
                            });
                        }
                    });
                }
            }

            // Applique l'état retourné ou non à une slide et son fond (avec ou sans animation)
            function applyFlipAtIndex(index, flipped, animate) {
                const pair = [swiperSlides[index], bgSlides[index]];
                pair.forEach(el => {
                    if (!el) return;
                    if (!animate) {
                        el.classList.add('no-transition');
                    }
                    if (flipped) {
                        el.classList.add('is-flipped');
                    } else {
                        el.classList.remove('is-flipped');
                    }
                    if (!animate) {
                        void el.offsetWidth; // Force le recalcul immédiat sans transition
                        el.classList.remove('no-transition');
                    }
                });
            }

            let currentBgDuration = 0;
            let baseBgIndex = 0;

            // Synchronise le fondu enchaîné de l'arrière-plan avec la progression verticale du swipe
            // Le fond de départ (baseBgIndex) reste à opacité 1 en dessous (z-index: 1) pendant que le nouveau fond
            // varie entre 0 et 1 par-dessus (z-index: 2), garantissant un fondu enchaîné pur sans saut ni voile gris.
            function syncBackgroundCrossfade(swiperInstance) {
                const activeIdx = swiperInstance.activeIndex || 0;

                for (let i = 0; i < swiperInstance.slides.length; i++) {
                    const absP = Math.abs(swiperInstance.slides[i].progress || 0);
                    const bgSlide = bgSlides[i];
                    if (!bgSlide) continue;

                    if (absP >= 0.999) {
                        if (currentBgDuration > 0 && bgSlide.dataset.wasVisible === 'true') {
                            if (i === baseBgIndex && activeIdx !== baseBgIndex) {
                                // Le fond de départ reste à opacité 1 en dessous pendant toute la durée du fondu
                                bgSlide.style.zIndex = '1';
                                bgSlide.style.transition = `opacity 0ms linear ${currentBgDuration}ms`;
                            } else {
                                // Un glissement annulé redescend doucement vers 0 par-dessus la base
                                bgSlide.style.zIndex = '2';
                                void bgSlide.offsetWidth;
                                bgSlide.style.transition = `opacity ${currentBgDuration}ms ease-out`;
                            }
                        } else {
                            bgSlide.style.zIndex = '0';
                            bgSlide.style.transition = 'none';
                        }
                        bgSlide.style.opacity = '0';
                        bgSlide.dataset.wasVisible = 'false';
                    } else {
                        bgSlide.dataset.wasVisible = 'true';

                        if (currentBgDuration > 0) {
                            // Transition animée (relâchement du doigt, molette ou clavier)
                            if (i === baseBgIndex && activeIdx === baseBgIndex) {
                                // Retour à la carte de départ après un petit glissement annulé
                                bgSlide.style.zIndex = '1';
                                bgSlide.style.transition = 'none';
                                bgSlide.style.opacity = '1';
                            } else {
                                // Nouvelle carte active qui fond de son opacité actuelle jusqu'à 1
                                bgSlide.style.zIndex = '2';
                                void bgSlide.offsetWidth;
                                bgSlide.style.transition = `opacity ${currentBgDuration}ms ease-out`;
                                bgSlide.style.opacity = '1';
                            }
                        } else {
                            // Glissement tactile en direct (duration === 0)
                            bgSlide.style.transition = 'none';
                            if (i === baseBgIndex) {
                                bgSlide.style.zIndex = '1';
                                bgSlide.style.opacity = '1';
                            } else {
                                bgSlide.style.zIndex = '2';
                                bgSlide.style.opacity = (1 - absP).toFixed(3);
                            }
                        }
                    }
                }

                if (currentBgDuration > 0) {
                    baseBgIndex = activeIdx;
                }
            }

            const swiperEl = document.querySelector('.swiper');

            // 3. INITIALISATION DE SWIPER
            // Les cartes du premier plan arrivent par-dessus verticalement, tandis que #bg-stage fait un fondu enchaîné
            const swiper = new Swiper('.swiper', {
                direction: 'vertical',
                effect: 'creative',
                watchSlidesProgress: true,
                creativeEffect: {
                    limitProgress: 2,
                    perspective: false,
                    prev: {
                        // La carte précédente reste en place dessous pendant que la nouvelle la recouvre
                        shadow: false,
                        translate: [0, 0, -1],
                        scale: 1,
                        opacity: 1,
                    },
                    next: {
                        // La nouvelle carte arrive du bas par-dessus la carte actuelle
                        shadow: false,
                        translate: [0, '100%', 0],
                        scale: 1,
                        opacity: 1,
                    },
                },
                speed: 550,
                resistanceRatio: 0.8,
                touchAngle: 45,
                mousewheel: true,
                keyboard: { enabled: true },
                on: {
                    init: function () {
                        updateLoadedSlides(0);
                        syncBackgroundCrossfade(this);
                    },
                    sliderFirstMove: function () {
                        swiperEl.classList.add('is-sliding');
                    },
                    transitionStart: function () {
                        swiperEl.classList.add('is-sliding');
                    },
                    transitionEnd: function () {
                        swiperEl.classList.remove('is-sliding');
                    },
                    touchEnd: function () {
                        if (!this.animating) {
                            swiperEl.classList.remove('is-sliding');
                        }
                    },
                    setTransition: function (swiperInstance, duration) {
                        currentBgDuration = duration;
                    },
                    setTranslate: function () {
                        syncBackgroundCrossfade(this);
                    },
                    slideChange: function () {
                        const activeIndex = this.activeIndex;
                        updateLoadedSlides(activeIndex);
                        applyFlipAtIndex(activeIndex, isGlobalFlipped, false);
                    }
                }
            });

            // 4. FONCTION DE RETOURNEMENT (Face A <-> Face B)
            window.toggleGlobalFlip = function() {
                isGlobalFlipped = !isGlobalFlipped;
                const activeIndex = swiper.activeIndex;

                for (let idx = 0; idx < totalCards; idx++) {
                    // Anime uniquement la carte et le fond actifs ; met à jour les autres instantanément
                    applyFlipAtIndex(idx, isGlobalFlipped, idx === activeIndex);
                }
            };

            // 5. DÉTECTION DU SWIPE HORIZONTAL ET DU TAP POUR RETOURNER LA CARTE
            let startX = 0;
            let startY = 0;
            let startTime = 0;
            let isTracking = false;
            let lastTouchTime = 0;

            function onGestureStart(x, y) {
                startX = x;
                startY = y;
                startTime = Date.now();
                isTracking = true;
            }

            function onGestureEnd(x, y) {
                if (!isTracking) return;
                isTracking = false;

                const deltaX = x - startX;
                const deltaY = y - startY;
                const absX = Math.abs(deltaX);
                const absY = Math.abs(deltaY);
                const elapsed = Date.now() - startTime;

                // Cas 1 : Swipe horizontal franc (gauche ou droite)
                if (absX > 30 && absX > absY * 1.2) {
                    window.toggleGlobalFlip();
                    return;
                }

                // Cas 2 : Tap / Clic rapide sans mouvement vertical
                if (absX < 12 && absY < 12 && elapsed < 350) {
                    window.toggleGlobalFlip();
                }
            }

            // Événements tactiles (iOS / Android)
            swiperEl.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    lastTouchTime = Date.now();
                    onGestureStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            swiperEl.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1) {
                    lastTouchTime = Date.now();
                    onGestureEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                }
            }, { passive: true });

            // Événements souris (Ordinateur)
            swiperEl.addEventListener('mousedown', (e) => {
                if (Date.now() - lastTouchTime < 500) return;
                onGestureStart(e.clientX, e.clientY);
            });

            swiperEl.addEventListener('mouseup', (e) => {
                if (Date.now() - lastTouchTime < 500) return;
                onGestureEnd(e.clientX, e.clientY);
            });

            // Support des flèches Gauche / Droite au clavier pour retourner la carte
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    window.toggleGlobalFlip();
                }
            });
        });
    </script>
</body>
</html>

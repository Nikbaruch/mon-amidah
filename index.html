<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Référencement & PWA -->
    <title>Amidah - 18 Bénédictions</title>
    <meta name="description" content="Livre de prière numérique">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">

    <!-- Swiper CSS (Librairie pour le slide) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* --- RESET & BASE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            overflow: hidden; /* Empêche le scroll natif du navigateur */
            background-color: #121212; /* Fond sombre élégant */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- CONTENEUR SWIPER --- */
        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            /* Padding réduit pour maximiser l'espace de la carte */
            padding: 10px;
        }

        /* --- LA CARTE (SCÈNE 3D) --- */
        .card-scene {
            width: 100%;
            /* Largeur max : on laisse la carte prendre de la place mais on garde des marges */
            max-width: 90vw; 
            aspect-ratio: 9/16; 
            /* On limite la hauteur pour être sûr qu'elle tienne dans l'écran sans scroll */
            max-height: 90vh;
            perspective: 1000px; /* Donne la profondeur 3D */
            cursor: pointer;
        }

        /* Le conteneur qui bouge */
        .card-object {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            /* Ombre légère pour détacher la carte du fond */
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        /* Classe ajoutée en JS pour retourner la carte */
        .card-object.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- FACES DE LA CARTE --- */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Cache le dos quand on retourne */
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Face Arrière (Verso) */
        .card-face.back {
            transform: rotateY(180deg);
            background: #2a2a2a;
        }

        /* --- IMAGES --- */
        .card-face img {
            width: 100%;
            height: 100%;
            /* 'contain' assure que tout le texte est visible */
            object-fit: contain; 
            pointer-events: none;
            display: block;
        }
        
        /* Style pour le message d'erreur d'image */
        .error-message {
            padding: 20px;
            font-size: 0.8em;
            text-align: center;
            color: white;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Swiper Container Principal -->
    <div class="swiper">
        <!-- Les cartes seront générées ici par le Javascript -->
        <div class="swiper-wrapper" id="cards-wrapper"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // CONFIGURATION
        const totalCards = 18; // Nombre total de cartes
        const wrapper = document.getElementById('cards-wrapper');
        let isGlobalFlipped = false; // État global : est-ce qu'on regarde le recto ou le verso ?

        // FONCTION DE GESTION D'ERREUR
        window.handleImageError = function(imgElement, imageSource) {
            imgElement.parentElement.style.background = '#b91c1c';
            imgElement.style.display = 'none';
            const msg = document.createElement('div');
            msg.className = 'error-message';
            msg.innerHTML = `Image manquante:<br><br>${imageSource}`;
            imgElement.parentElement.appendChild(msg);
        };

        // GÉNÉRATION AUTOMATIQUE DES 18 CARTES
        for (let i = 1; i <= totalCards; i++) {
            const num = i.toString().padStart(2, '0');
            const imgRecto = `images/cards/card-${num}-a.png`;
            const imgVerso = `images/cards/card-${num}-b.png`;

            // Note : j'ai supprimé les <div> page-number et instruction
            // Note : onclick appelle maintenant toggleGlobalFlip()
            const slideHTML = `
                <div class="swiper-slide">
                    <div class="card-scene" onclick="toggleGlobalFlip()">
                        <div class="card-object">
                            <!-- RECTO (Face A) -->
                            <div class="card-face front">
                                <img src="${imgRecto}" alt="Bénédiction ${i}" 
                                     onerror="handleImageError(this, '${imgRecto}')">
                            </div>

                            <!-- VERSO (Face B) -->
                            <div class="card-face back">
                                <img src="${imgVerso}" alt="Explication ${i}"
                                     onerror="handleImageError(this, '${imgVerso}')">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            wrapper.insertAdjacentHTML('beforeend', slideHTML);
        }

        // 1. Initialisation de Swiper (Scroll Vertical)
        const swiper = new Swiper('.swiper', {
            direction: 'vertical',
            effect: 'slide',
            speed: 400,
            spaceBetween: 0,
            mousewheel: true,
            keyboard: { enabled: true },
        });

        // 2. Fonction Globale pour retourner TOUTES les cartes
        // Quand on clique, on change l'état "mode verso" pour toute l'appli
        function toggleGlobalFlip() {
            isGlobalFlipped = !isGlobalFlipped;
            
            // On applique la rotation à toutes les cartes (celle visible et les suivantes)
            const allCards = document.querySelectorAll('.card-object');
            allCards.forEach(card => {
                if (isGlobalFlipped) {
                    card.classList.add('is-flipped');
                } else {
                    card.classList.remove('is-flipped');
                }
            });
        }
    </script>
</body>
</html>

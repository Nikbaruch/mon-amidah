<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Référencement & PWA -->
    <title>Amidah - 18 Bénédictions</title>
    <meta name="description" content="Livre de prière numérique">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">

    <!-- Swiper CSS (Librairie pour le slide) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* --- RESET & BASE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0;
            /* Utilisation de dvh pour s'adapter parfaitement aux mobiles avec barres d'adresse */
            height: 100dvh; 
            width: 100%;
            overflow: hidden; 
            background-color: #121212; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- CONTENEUR SWIPER --- */
        .swiper {
            width: 100%;
            height: 100dvh; /* Force la hauteur dynamique */
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0; /* Suppression du padding pour éviter tout décalage */
        }

        /* --- LA CARTE (SCÈNE 3D) --- */
        .card-scene {
            width: 100%;
            /* Ajustement des dimensions pour être sûr que ça rentre sans déborder */
            max-width: 95vw; 
            aspect-ratio: 9/16; 
            max-height: 95dvh;
            perspective: 1000px;
            cursor: pointer;
            /* Centrage explicite */
            margin: auto; 
        }

        /* Le conteneur qui bouge */
        .card-object {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 0; /* Suppression du radius par défaut si l'image le gère déjà */
        }

        /* Classe ajoutée en JS pour retourner la carte */
        .card-object.is-flipped {
            transform: rotateY(180deg);
        }

        /* --- FACES DE LA CARTE --- */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: visible; /* On laisse l'image gérer les bords */
            background: transparent; /* Suppression du fond gris */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Face Arrière (Verso) */
        .card-face.back {
            transform: rotateY(180deg);
            background: transparent; /* Suppression du fond gris */
        }

        /* --- IMAGES --- */
        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            pointer-events: none;
            display: block;
        }
        
        /* Style pour le message d'erreur d'image */
        .error-message {
            padding: 20px;
            font-size: 0.8em;
            text-align: center;
            color: white;
            line-height: 1.4;
            background: rgba(0,0,0,0.8); /* Fond sombre pour le message d'erreur */
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Swiper Container Principal -->
    <div class="swiper">
        <!-- Les cartes seront générées ici par le Javascript -->
        <div class="swiper-wrapper" id="cards-wrapper"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // CONFIGURATION
        const totalCards = 18; // Nombre total de cartes
        const wrapper = document.getElementById('cards-wrapper');
        let isGlobalFlipped = false; // État global : est-ce qu'on regarde le recto ou le verso ?

        // FONCTION DE GESTION D'ERREUR
        window.handleImageError = function(imgElement, imageSource) {
            imgElement.style.display = 'none';
            const msg = document.createElement('div');
            msg.className = 'error-message';
            msg.innerHTML = `Image manquante:<br><br>${imageSource}`;
            imgElement.parentElement.appendChild(msg);
        };

        // GÉNÉRATION AUTOMATIQUE DES 18 CARTES
        for (let i = 1; i <= totalCards; i++) {
            const num = i.toString().padStart(2, '0');
            const imgRecto = `images/cards/card-${num}-a.png`;
            const imgVerso = `images/cards/card-${num}-b.png`;

            const slideHTML = `
                <div class="swiper-slide">
                    <div class="card-scene" onclick="toggleGlobalFlip()">
                        <div class="card-object">
                            <!-- RECTO (Face A) -->
                            <div class="card-face front">
                                <img src="${imgRecto}" alt="Bénédiction ${i}" 
                                     onerror="handleImageError(this, '${imgRecto}')">
                            </div>

                            <!-- VERSO (Face B) -->
                            <div class="card-face back">
                                <img src="${imgVerso}" alt="Explication ${i}"
                                     onerror="handleImageError(this, '${imgVerso}')">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            wrapper.insertAdjacentHTML('beforeend', slideHTML);
        }

        // 1. Initialisation de Swiper (Scroll Vertical)
        const swiper = new Swiper('.swiper', {
            direction: 'vertical',
            effect: 'slide',
            speed: 400,
            spaceBetween: 0,
            mousewheel: true,
            keyboard: { enabled: true },
        });

        // 2. Fonction Globale pour retourner TOUTES les cartes
        function toggleGlobalFlip() {
            isGlobalFlipped = !isGlobalFlipped;
            
            const allCards = document.querySelectorAll('.card-object');
            allCards.forEach(card => {
                if (isGlobalFlipped) {
                    card.classList.add('is-flipped');
                } else {
                    card.classList.remove('is-flipped');
                }
            });
        }
    </script>
</body>
</html>

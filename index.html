<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Référencement & PWA -->
    <title>Amidah - 18 Bénédictions</title>
    <meta name="description" content="Livre de prière numérique">
    
    <!-- Configuration iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <!-- Icône pour l'écran d'accueil -->
    <link rel="apple-touch-icon" href="images/cards/card-01-a.png">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* ==========================================================================
           PARAMÈTRES D'AJUSTEMENT VISUEL (Modifiez ces valeurs selon vos besoins)
           ========================================================================== */
        :root {
            /* 1. Taille de la carte au premier plan */
            --card-width: 88vw;               /* Largeur de la carte (ex: 75vw à 92vw) */
            --card-max-height: 60dvh;         /* Hauteur max de la carte (ex: 50dvh à 75dvh) */
            --card-radius: 3.1% / 2.2%;       /* Arrondi des coins de la carte */

            /* 2. Opacité de la carte au premier plan */
            --face-a-opacity: 1;              /* Opacité quand la Face A est devant (1 = 100%) */
            --face-b-opacity: 0.86;           /* Opacité quand la Face B est devant (0.86 = 86%) */

            /* 3. Lueur externe noire (effet de premier plan) */
            /* Format : [décalage-x] [décalage-y] [flou] [étendue] [couleur] */
            --card-glow: 0 0 28px 6px rgba(0, 0, 0, 0.85);

            /* 4. Arrière-plan (plein écran sans bord) */
            /* Zoom (> 1.07) pour rogner les bords de la carte en arrière-plan */
            --bg-scale-a: 1.08;               /* Zoom du fond quand la Face A est en arrière-plan */
            --bg-scale-b: 1.08;               /* Zoom du fond quand la Face B est en arrière-plan */
            --bg-opacity-a: 1;                /* Opacité de la Face A en arrière-plan */
            --bg-opacity-b: 1;                /* Opacité de la Face B en arrière-plan */

            /* 5. Vitesse des animations */
            --flip-duration: 0.6s;            /* Durée du retournement 3D */
            --flip-half: 0.3s;                /* Moitié de --flip-duration (bascule à 90°) */
        }

        /* ==========================================================================
           RESET & BASE
           ========================================================================== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* ==========================================================================
           CONTENEUR SWIPER & SLIDES
           ========================================================================== */
        .swiper {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .swiper-slide {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Empêche tout débordement de l'arrière-plan */
            background: #000000;
        }

        /* Optimisation mémoire iOS : masque le rendu des slides éloignées */
        .swiper-slide.is-unloaded .slide-bg,
        .swiper-slide.is-unloaded .card-scene {
            visibility: hidden;
        }

        /* ==========================================================================
           ARRIÈRE-PLAN PLEIN ÉCRAN (SANS BORD)
           ========================================================================== */
        .slide-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity var(--flip-duration) ease;
        }

        /* Fond Face B (visible quand la Face A est au premier plan) */
        .bg-layer.bg-b {
            background-color: #ffffff;
            opacity: var(--bg-opacity-b);
        }

        /* Fond Face A (visible quand la Face B est au premier plan) */
        .bg-layer.bg-a {
            background-color: #000000;
            opacity: 0;
        }

        /* Bascule de l'arrière-plan quand la carte est retournée */
        .swiper-slide.is-flipped .bg-layer.bg-b {
            opacity: 0;
        }
        .swiper-slide.is-flipped .bg-layer.bg-a {
            opacity: var(--bg-opacity-a);
        }

        .bg-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Couvre 100% de la hauteur et de la largeur */
            object-position: center center;
            display: block;
            pointer-events: none;
        }

        .bg-layer.bg-a img {
            transform: scale(var(--bg-scale-a));
        }

        .bg-layer.bg-b img {
            transform: scale(var(--bg-scale-b));
        }

        /* ==========================================================================
           CARTE AU PREMIER PLAN (SCÈNE 3D)
           ========================================================================== */
        .card-scene {
            position: relative;
            z-index: 2;
            /* Garde toujours le ratio exact 1080/1522 de la carte pour que la lueur colle aux bords */
            width: min(var(--card-width), calc(var(--card-max-height) * 1080 / 1522));
            aspect-ratio: 1080 / 1522;
            perspective: 1200px;
            cursor: pointer;
            margin: auto;
        }

        .card-object {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform var(--flip-duration) cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* État retourné (Face B au premier plan) */
        .swiper-slide.is-flipped .card-object {
            transform: rotateY(180deg);
        }

        /* --- FACES DE LA CARTE --- */
        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: var(--card-radius);
            /* Lueur externe noire pour l'effet de premier plan */
            box-shadow: var(--card-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        /* Bascule nette à mi-parcours (90°) pour que la Face A ne transparaisse jamais sous les 86% de la Face B */
        .card-face.front {
            opacity: 1;
            transition: opacity 0s linear var(--flip-half);
        }

        .card-face.back {
            transform: rotateY(180deg);
            opacity: 0;
            transition: opacity 0s linear var(--flip-half);
        }

        .swiper-slide.is-flipped .card-face.front {
            opacity: 0;
        }

        .swiper-slide.is-flipped .card-face.back {
            opacity: 1;
        }

        /* Opacité propre à chaque face au premier plan */
        .card-face.front img {
            opacity: var(--face-a-opacity);
        }

        .card-face.back img {
            opacity: var(--face-b-opacity);
        }

        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            display: block;
        }

        /* Désactive temporairement les transitions pour les mises à jour instantanées hors-écran */
        .no-transition,
        .no-transition .card-object,
        .no-transition .card-face,
        .no-transition .bg-layer {
            transition: none !important;
        }
    </style>
</head>
<body>

    <!-- Swiper Container Principal -->
    <div class="swiper">
        <div class="swiper-wrapper" id="cards-wrapper"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const totalCards = 18;
            const wrapper = document.getElementById('cards-wrapper');
            let isGlobalFlipped = false; // false = Face A au 1er plan / true = Face B au 1er plan

            if (!wrapper) return;

            // Gestion d'erreur d'image : affiche simplement un fond noir à la place
            window.handleImageError = function(imgElement) {
                if (!imgElement.getAttribute('src')) return; // Ignore la décharge mémoire volontaire
                imgElement.dataset.failed = 'true';
                imgElement.style.display = 'none';
                if (imgElement.parentElement) {
                    imgElement.parentElement.style.backgroundColor = '#000000';
                }
            };

            // 1. GÉNÉRATION DES 18 SLIDES (sans charger toutes les textures d'un coup pour iOS)
            for (let i = 1; i <= totalCards; i++) {
                const num = i.toString().padStart(2, '0');
                const imgRecto = `images/cards/card-${num}-a.png`;
                const imgVerso = `images/cards/card-${num}-b.png`;

                const slideHTML = `
                    <div class="swiper-slide is-unloaded" data-index="${i - 1}">
                        <!-- ARRIÈRE-PLAN PLEIN ÉCRAN (Face opposée) -->
                        <div class="slide-bg">
                            <div class="bg-layer bg-b">
                                <img data-src="${imgVerso}" alt="" decoding="async"
                                     onerror="handleImageError(this, '${imgVerso}')">
                            </div>
                            <div class="bg-layer bg-a">
                                <img data-src="${imgRecto}" alt="" decoding="async"
                                     onerror="handleImageError(this, '${imgRecto}')">
                            </div>
                        </div>

                        <!-- CARTE AU PREMIER PLAN -->
                        <div class="card-scene">
                            <div class="card-object">
                                <!-- RECTO (Face A - 100% opacité) -->
                                <div class="card-face front">
                                    <img data-src="${imgRecto}" alt="Bénédiction ${i}" decoding="async"
                                         onerror="handleImageError(this, '${imgRecto}')">
                                </div>

                                <!-- VERSO (Face B - 86% opacité) -->
                                <div class="card-face back">
                                    <img data-src="${imgVerso}" alt="Explication ${i}" decoding="async"
                                         onerror="handleImageError(this, '${imgVerso}')">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                wrapper.insertAdjacentHTML('beforeend', slideHTML);
            }

            // 2. GESTION MÉMOIRE GPU iOS :
            // Ne garde en mémoire que la carte active et ses voisines immédiates (évite le crash WebKit sur iOS)
            function updateLoadedSlides(activeIndex) {
                const slides = wrapper.querySelectorAll('.swiper-slide');
                slides.forEach((slide, index) => {
                    const shouldBeLoaded = index >= activeIndex - 1 && index <= activeIndex + 2;
                    const imgs = slide.querySelectorAll('img[data-src]');

                    if (shouldBeLoaded) {
                        slide.classList.remove('is-unloaded');
                        imgs.forEach(img => {
                            if (img.dataset.failed === 'true') return;
                            const targetSrc = img.getAttribute('data-src');
                            if (img.getAttribute('src') !== targetSrc) {
                                img.style.display = 'block';
                                img.setAttribute('src', targetSrc);
                            }
                        });
                    } else {
                        slide.classList.add('is-unloaded');
                        imgs.forEach(img => {
                            if (img.hasAttribute('src')) {
                                img.removeAttribute('src');
                            }
                        });
                    }
                });
            }

            // Applique l'état retourné ou non à une slide (avec ou sans animation)
            function applyFlipToSlide(slide, flipped, animate) {
                if (!animate) {
                    slide.classList.add('no-transition');
                }
                if (flipped) {
                    slide.classList.add('is-flipped');
                } else {
                    slide.classList.remove('is-flipped');
                }
                if (!animate) {
                    void slide.offsetWidth; // Force le recalcul immédiat sans transition
                    slide.classList.remove('no-transition');
                }
            }

            // 3. INITIALISATION DE SWIPER (Empilement vertical sans pile visible après le swipe)
            const swiper = new Swiper('.swiper', {
                direction: 'vertical',
                effect: 'creative',
                creativeEffect: {
                    limitProgress: 1, // Seule la carte immédiatement sous la nouvelle est calculée
                    perspective: false,
                    prev: {
                        // La carte précédente reste exactement dessous et est entièrement recouverte
                        shadow: false,
                        translate: [0, 0, -1],
                        scale: 1,
                        opacity: 1,
                    },
                    next: {
                        // La carte suivante monte du bas pour s'empiler par-dessus
                        translate: [0, '100%', 0],
                    },
                },
                speed: 550,
                resistanceRatio: 0.8,
                touchAngle: 45,
                mousewheel: true,
                keyboard: { enabled: true },
                on: {
                    init: function () {
                        updateLoadedSlides(0);
                    },
                    slideChange: function () {
                        const activeIndex = this.activeIndex;
                        updateLoadedSlides(activeIndex);

                        // S'assure que la carte active et ses voisines sont sur la bonne face sans animer pendant le slide
                        this.slides.forEach((slide, idx) => {
                            if (idx === activeIndex) {
                                applyFlipToSlide(slide, isGlobalFlipped, false);
                            }
                        });
                    }
                }
            });

            // 4. FONCTION DE RETOURNEMENT (Face A <-> Face B)
            window.toggleGlobalFlip = function() {
                isGlobalFlipped = !isGlobalFlipped;
                const activeIndex = swiper.activeIndex;

                swiper.slides.forEach((slide, idx) => {
                    // Anime uniquement la slide visible ; met à jour les autres instantanément
                    applyFlipToSlide(slide, isGlobalFlipped, idx === activeIndex);
                });
            };

            // 5. DÉTECTION DU SWIPE HORIZONTAL ET DU TAP POUR RETOURNER LA CARTE
            let startX = 0;
            let startY = 0;
            let startTime = 0;
            let isTracking = false;
            let lastTouchTime = 0;

            const swiperEl = document.querySelector('.swiper');

            function onGestureStart(x, y) {
                startX = x;
                startY = y;
                startTime = Date.now();
                isTracking = true;
            }

            function onGestureEnd(x, y) {
                if (!isTracking) return;
                isTracking = false;

                const deltaX = x - startX;
                const deltaY = y - startY;
                const absX = Math.abs(deltaX);
                const absY = Math.abs(deltaY);
                const elapsed = Date.now() - startTime;

                // Cas 1 : Swipe horizontal franc (gauche ou droite)
                if (absX > 30 && absX > absY * 1.2) {
                    window.toggleGlobalFlip();
                    return;
                }

                // Cas 2 : Tap / Clic rapide sans mouvement vertical
                if (absX < 12 && absY < 12 && elapsed < 350) {
                    window.toggleGlobalFlip();
                }
            }

            // Événements tactiles (iOS / Android)
            swiperEl.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    lastTouchTime = Date.now();
                    onGestureStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            swiperEl.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1) {
                    lastTouchTime = Date.now();
                    onGestureEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                }
            }, { passive: true });

            // Événements souris (Ordinateur)
            swiperEl.addEventListener('mousedown', (e) => {
                if (Date.now() - lastTouchTime < 500) return;
                onGestureStart(e.clientX, e.clientY);
            });

            swiperEl.addEventListener('mouseup', (e) => {
                if (Date.now() - lastTouchTime < 500) return;
                onGestureEnd(e.clientX, e.clientY);
            });

            // Support des flèches Gauche / Droite au clavier pour retourner la carte
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    window.toggleGlobalFlip();
                }
            });
        });
    </script>
</body>
</html>
